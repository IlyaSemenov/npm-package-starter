jobs:
  test-and-release:
    steps:
      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # Creates .npmrc to use NODE_AUTH_TOKEN for the first publish.
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Test package
        run: bun run test
