jobs:
  test:
    steps:
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint package
        run: pnpm run lint:check

      - name: Build package
        run: pnpm run build

      - name: Typecheck package
        run: pnpm run types

      - name: Test package
        run: pnpm run test
