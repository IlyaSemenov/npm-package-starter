name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    # A release commit only versions a commit whose CI the release has waited for.
    # A skipped job satisfies required status checks, unlike a skipped workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7

      # Runtime blocks insert setup/install/lint/build/typecheck/test steps here.
