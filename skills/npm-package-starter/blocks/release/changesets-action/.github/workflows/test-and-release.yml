name: Test and Release

env:
  # Keep in sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test-and-release:
    name: Test and Release

    steps:
      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          # Creates .npmrc to use NODE_AUTH_TOKEN for the first publish.
          registry-url: https://registry.npmjs.org

      - name: Capture release title
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          npx @changesets/cli status --output=release.json
          echo "RELEASE=Release $(jq -r '.releases | sort_by(.name) | map(.name + "@" + .newVersion) | join(", ")' release.json)" >> "$GITHUB_ENV"
          rm release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v2.1.2
        with:
          publish-script: npx changeset publish
          pr-title: ${{ env.RELEASE }}
          commit-message: ${{ env.RELEASE }}

        # Bootstrap only. Remove after confirming the initial npm publication.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
