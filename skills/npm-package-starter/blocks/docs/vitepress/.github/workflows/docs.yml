name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # VitePress takes last updated times from the Git history.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.19

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
